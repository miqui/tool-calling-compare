[project]
name = "tool-calling-compare-openhands"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "openhands-sdk",
    "openhands-tools>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcc_openhands"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
