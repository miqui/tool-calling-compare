name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ai-sdk-ts/.nvmrc
          cache: npm
          cache-dependency-path: ai-sdk-ts/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test
  lint-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: openhands-py
        working-directory: openhands-py
        run: |
          uv python install
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run python -m unittest discover -s tests -v
      - name: crewai-py
        working-directory: crewai-py
        run: |
          uv python install
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run python -m unittest discover -s tests -v
